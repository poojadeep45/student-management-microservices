server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: student-service-route
            uri: lb://student-service
            predicates:
              - Path=/students/**

          - id: auth-route
            uri: lb://student-service
            predicates:
              - Path=/auth/**

          - id: course-service-route
            uri: lb://course-service
            predicates:
              - Path=/courses/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true